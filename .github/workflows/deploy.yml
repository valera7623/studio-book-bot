# Автодеплой: GitHub Actions → GHCR → VPS 185.106.95.16
# Репозиторий: valera7623/studio-book-bot
#
# Secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST       — 185.106.95.16
#   VPS_USERNAME   — valera
#   VPS_SSH_KEY    — приватный ключ (github_actions_deploy), публичный уже в authorized_keys
#   VPS_PORT       — опционально, по умолчанию 22
#
# Образ: ghcr.io/valera7623/studio-book-bot (GITHUB_TOKEN, Docker Hub не нужен).

name: Deploy studio-book to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: studio-book-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/valera7623/studio-book-bot
  DEPLOY_DIR: /home/valera/studio-book

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure deploy directory on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: mkdir -p ${{ env.DEPLOY_DIR }}/data

      - name: Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: docker-compose.prod.yml
          target: ${{ env.DEPLOY_DIR }}/

      - name: Pull image and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE_NAME }}:latest
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 10m
          envs: GHCR_TOKEN,IMAGE,DEPLOY_DIR
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u valera7623 --password-stdin
            cd "$DEPLOY_DIR"
            touch .env
            chmod 600 .env
            if grep -q '^DOCKER_IMAGE=' .env; then
              sed -i "s|^DOCKER_IMAGE=.*|DOCKER_IMAGE=${IMAGE}|" .env
            else
              printf '\nDOCKER_IMAGE=%s\n' "$IMAGE" >> .env
            fi
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate --no-build
            docker logout ghcr.io || true
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail 20
