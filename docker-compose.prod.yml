# Production на VPS РФ.
# GitHub Actions пушит ghcr.io/valera7623/studio-book-bot и на сервере только pull.
# Локально / scripts/deploy-vps.sh: docker compose up --build (образ studio-book:local).
#
# network_mode: host — polling к api.telegram.org как у хоста.
services:
  bot:
    image: ${DOCKER_IMAGE:-studio-book:local}
    build: .
    network_mode: host
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/studio_book.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    pull_policy: missing
