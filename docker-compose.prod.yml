# Production на VPS РФ.
# Образ только из GHCR (GitHub Actions). На сервере pull / --no-build, не --build.
#
# network_mode: host — polling к api.telegram.org как у хоста.
services:
  redis:
    image: redis:7-alpine
    network_mode: host
    command: ["redis-server", "--port", "6379", "--save", "", "--appendonly", "no", "--bind", "127.0.0.1"]
    restart: unless-stopped
  bot:
    image: ${DOCKER_IMAGE:-ghcr.io/valera7623/studio-book-bot:latest}
    network_mode: host
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/studio_book.db
      USE_REDIS: "true"
      REDIS_URL: redis://127.0.0.1:6379/0
    volumes:
      - ./data:/app/data
      # Off-site копия бэкапа (BACKUP_OFFSITE_DIR=/offsite в .env):
      # - /mnt/studio-book-offsite:/offsite
    restart: unless-stopped
    pull_policy: missing
    depends_on:
      - redis
